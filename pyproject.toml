[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "stegogan"
version = "1.0.0"
description = "Wavelet-gated invertible steganography for full-size RGB image payloads"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26,<3",
  "pillow>=10,<13",
  "torch>=2.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.9,<1",
  "matplotlib>=3.8,<4",
]

[project.scripts]
stegogan = "stego.cli:main"

[tool.setuptools.packages.find]
include = ["stego*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
