name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu -e ".[dev]"
      - run: ruff check .
      - run: python -m pytest
      - run: python -m stego.cli smoke --device cpu
      - run: >-
          python -m stego.cli smoke
          --device cpu
          --architecture invertible
          --image-size 32
          --secret-size 32
          --invertible-blocks 1
          --coupling-channels 8
